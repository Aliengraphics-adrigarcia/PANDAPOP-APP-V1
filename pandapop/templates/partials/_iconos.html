{# Iconos SVG propios (trazo simple). Uso: {{ icono('menu') }} #}

{%- elif nombre == 'modulos' -%}<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
{%- elif nombre == 'ayuda' -%}<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>
{%- elif nombre == 'perfil' -%}<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>

{%- elif nombre == 'atras' -%}<path d="M15 5l-7 7 7 7"/>
{%- elif nombre == 'flecha' -%}<path d="M9 5l7 7-7 7"/>

{%- elif nombre == 'candado' -%}<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
{%- elif nombre == 'ojo' -%}<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif nombre == 'check' -%}<path d="M5 12l5 5 9-10"/>
{%- elif nombre == 'juego' -%}<rect x="3" y="7" width="18" height="11" rx="4"/><path d="M8 10v5M5.5 12.5h5M15.5 11.5h.01M18 13.5h.01"/>
{%- elif nombre == 'libro' -%}<path d="M5 4h13a1 1 0 0 1 1 1v14H6a2 2 0 0 0-2 2V5a1 1 0 0 1 1-1zM4 19a2 2 0 0 1 2-2h13"/>

{%- elif nombre == 'reloj' -%}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- endif -%}
</svg>
{%- endmacro %}
